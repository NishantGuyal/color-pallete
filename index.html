<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Presentation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .color-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .color-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .color-box {
            width: 120px;
            height: 100px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #170e0d;
            border: 1px solid #ccc;
        }

        .color-box.light {
            border: 1px solid #ccc;
        }

        h2 {
            color: #170e0d;
        }
    </style>
</head>

<body>

    <div class="color-section">
        <h2>Primary Colors</h2>
        <div class="color-container">
            <div class="color-box" style="background-color: #C78E97;">#C78E97</div>
            <div class="color-box" style="background-color: #944B48; color: white;">#944B48</div>
        </div>
    </div>

    <div class="color-section">
        <h2>Secondary Colors</h2>
        <div class="color-container">
            <div class="color-box" style="background-color: #A47864;">#A47864</div>
            <div class="color-box" style="background-color: #F8F4E7;">#F8F4E7</div>
            <div class="color-box" style="background-color: #170E0D; color: white;">#170E0D</div>
        </div>
    </div>

</body>

</html>
